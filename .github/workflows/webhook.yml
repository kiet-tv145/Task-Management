name: GitHub CI/CD Discord Notification

on:
  push:
    branches: [ main ]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Webhook
        env:
          DISCORD_WEBHOOK: https://discord.com/api/webhooks/1538385654591782993/_khQaf3PrN9_2Lh4oeryOj4NuVSbjgHX03IEhfecdrgiBJjCyrSn6t5ATtv5Xvs5RFtk
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          AUTHOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"embeds\": [{\"title\": \"🚀 Có commit mới!\", \"url\": \"$COMMIT_URL\", \"color\": 3447003, \"fields\": [{\"name\": \"Commit\", \"value\": \"$COMMIT_MSG\", \"inline\": false}, {\"name\": \"👤 Người commit\", \"value\": \"$AUTHOR\", \"inline\": true}, {\"name\": \"📦 Repository\", \"value\": \"$REPO\", \"inline\": true}, {\"name\": \"🌿 Branch\", \"value\": \"$BRANCH\", \"inline\": true}]}]}" \
               $DISCORD_WEBHOOK